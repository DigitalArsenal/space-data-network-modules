[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "spacedatanetwork-astro"
dynamic = ["version"]
description = "Pinned SDN astrodynamics WASM artifacts; Python execution is dependency-blocked"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
spacedatanetwork-astro = "spacedatanetwork_astro.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "spacedatanetwork_astro._version.__version__"}

[tool.setuptools.package-data]
spacedatanetwork_astro = ["artifacts.lock.json", "artifacts/*/*.wasm", "artifacts/*/*.json", "py.typed"]
